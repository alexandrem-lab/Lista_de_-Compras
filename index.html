<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Lista de Compras</title>

  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Compras">
  <meta name="theme-color" content="#16a34a">

  <style>
    :root {
      --verde: #16a34a;
      --verde-escuro: #15803d;
      --vermelho: #dc2626;
      --fundo: #f3f4f6;
      --borda: #e5e7eb;
      --texto: #111827;
      --cinza: #6b7280;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--fundo);
      color: var(--texto);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      overscroll-behavior-y: none;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 16px;
      text-align: center;
      color: #fff;
      background: var(--verde);
      box-shadow: 0 2px 6px rgba(0, 0, 0, .14);
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 12px;
      padding-bottom: 115px;
    }

    .adicionar-area {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .adicionar-area input {
      flex: 1;
      min-width: 0;
    }

    input {
      width: 100%;
      min-height: 48px;
      padding: 11px 12px;
      font-size: 16px;
      color: var(--texto);
      background: #fff;
      border: 1px solid #d1d5db;
      border-radius: 10px;
    }

    input:focus {
      outline: 2px solid rgba(22, 163, 74, .35);
      border-color: var(--verde);
    }

    button {
      border: 0;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
    }

    .btn-adicionar {
      flex: 0 0 auto;
      min-width: 106px;
      padding: 0 16px;
      color: #fff;
      background: var(--verde);
      border-radius: 10px;
      font-size: 15px;
    }

    .btn-adicionar:active {
      background: var(--verde-escuro);
    }

    .lista {
      overflow: hidden;
      background: #fff;
      border: 1px solid var(--borda);
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .06);
    }

    .linha-vazia {
      padding: 28px 16px;
      text-align: center;
      color: var(--cinza);
      font-size: 15px;
    }

    .swipe-item {
      position: relative;
      overflow: hidden;
      min-height: 92px;
      border-bottom: 1px solid var(--borda);
      touch-action: pan-y;
    }

    .swipe-item:last-child {
      border-bottom: 0;
    }

    .acao-excluir {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 104px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: var(--vermelho);
      font-size: 15px;
    }

    .conteudo-item {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 76px 105px;
      gap: 8px;
      align-items: center;
      min-height: 92px;
      padding: 12px;
      background: #fff;
      transform: translateX(0);
      transition: transform .18s ease;
      will-change: transform;
    }

    .conteudo-item.aberto {
      transform: translateX(-104px);
    }

    .nome-item {
      min-width: 0;
    }

    .nome-item strong {
      display: block;
      overflow: hidden;
      font-size: 16px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-item {
      margin-top: 4px;
      font-size: 12px;
      color: #d97706;
    }

    .status-item.preenchido {
      color: var(--verde);
    }

    .campo-item label {
      display: block;
      margin-bottom: 4px;
      color: var(--cinza);
      font-size: 11px;
      font-weight: 700;
    }

    .campo-item input {
      min-height: 42px;
      padding: 8px;
      font-size: 15px;
      text-align: center;
      border-radius: 8px;
    }

    .total-item {
      grid-column: 1 / -1;
      margin-top: -3px;
      color: var(--verde);
      font-size: 14px;
      font-weight: 700;
      text-align: right;
    }

    .barra-total {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
      background: #fff;
      border-top: 1px solid var(--borda);
      box-shadow: 0 -2px 10px rgba(0, 0, 0, .08);
    }

    .barra-total span {
      color: #374151;
      font-size: 15px;
      font-weight: 700;
    }

    .valor-total {
      color: var(--verde);
      font-size: 21px;
      font-weight: 800;
    }

    @media (max-width: 390px) {
      .conteudo-item {
        grid-template-columns: minmax(0, 1fr) 68px 93px;
        gap: 6px;
        padding: 10px;
      }

      .campo-item input {
        font-size: 14px;
      }

      .btn-adicionar {
        min-width: 92px;
        padding: 0 12px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>🛒 Lista de Compras</h1>
  </header>

  <main>
    <form id="formItem" class="adicionar-area">
      <input
        id="novoItem"
        type="text"
        placeholder="Adicionar item..."
        autocomplete="off"
        enterkeyhint="done"
      >
      <button class="btn-adicionar" type="submit">Adicionar</button>
    </form>

    <div id="lista" class="lista"></div>
  </main>

  <div class="barra-total">
    <span>Total geral</span>
    <div id="totalGeral" class="valor-total">R$ 0,00</div>
  </div>

  <script>
    const CHAVE = "listaComprasV3";
    const LIMITE_SWIPE = 104;

    let itens = [];

    try {
      itens = JSON.parse(localStorage.getItem(CHAVE) || "[]");

      if (!Array.isArray(itens)) {
        itens = [];
      }
    } catch (erro) {
      itens = [];
    }

    const form = document.getElementById("formItem");
    const novoItemInput = document.getElementById("novoItem");
    const lista = document.getElementById("lista");
    const totalGeral = document.getElementById("totalGeral");

    function escaparHtml(texto) {
      const div = document.createElement("div");
      div.textContent = String(texto || "");
      return div.innerHTML;
    }

    function converterNumero(texto) {
      let valor = String(texto ?? "")
        .trim()
        .replace("R$", "")
        .replace(/\s/g, "");

      if (!valor) return 0;

      if (valor.includes(",") && valor.includes(".")) {
        valor = valor.replace(/\./g, "").replace(",", ".");
      } else if (valor.includes(",")) {
        valor = valor.replace(",", ".");
      }

      const numero = Number(valor);
      return Number.isFinite(numero) && numero >= 0 ? numero : 0;
    }

    function formatarMoeda(valor) {
      return Number(valor || 0).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });
    }

    function valorParaCampo(valor) {
      const numero = Number(valor || 0);
      return numero > 0 ? String(numero).replace(".", ",") : "";
    }

    function salvar() {
      try {
        localStorage.setItem(CHAVE, JSON.stringify(itens));
      } catch (erro) {
        console.error("Não foi possível salvar a lista.", erro);
      }
    }

    function calcularTotalGeral() {
      return itens.reduce((soma, item) => {
        return soma + Number(item.quantidade || 0) * Number(item.valor || 0);
      }, 0);
    }

    function atualizarTotalGeral() {
      totalGeral.textContent = formatarMoeda(calcularTotalGeral());
    }

    function fecharOutrosItens(excecao = null) {
      document.querySelectorAll(".conteudo-item.aberto").forEach(elemento => {
        if (elemento !== excecao) {
          elemento.classList.remove("aberto");
        }
      });
    }

    function renderizar() {
      lista.innerHTML = "";

      if (itens.length === 0) {
        lista.innerHTML = `
          <div class="linha-vazia">
            Nenhum item adicionado ainda.
          </div>
        `;
        atualizarTotalGeral();
        return;
      }

      itens.forEach((item, index) => {
        const quantidade = Number(item.quantidade || 0);
        const valor = Number(item.valor || 0);
        const totalItem = quantidade * valor;
        const preenchido = quantidade > 0 && valor > 0;

        const linha = document.createElement("div");
        linha.className = "swipe-item";
        linha.dataset.index = index;

        linha.innerHTML = `
          <button type="button" class="acao-excluir" data-excluir="${index}">
            Excluir
          </button>

          <div class="conteudo-item">
            <div class="nome-item">
              <strong>${escaparHtml(item.item)}</strong>
              <div class="status-item ${preenchido ? "preenchido" : ""}">
                ${preenchido ? "✓ Preenchido" : "Pendente"}
              </div>
            </div>

            <div class="campo-item">
              <label for="quantidade-${index}">Qtd.</label>
              <input
                id="quantidade-${index}"
                type="text"
                inputmode="decimal"
                placeholder="0"
                value="${valorParaCampo(quantidade)}"
                data-campo="quantidade"
                data-index="${index}"
              >
            </div>

            <div class="campo-item">
              <label for="valor-${index}">Valor un.</label>
              <input
                id="valor-${index}"
                type="text"
                inputmode="decimal"
                placeholder="0,00"
                value="${valorParaCampo(valor)}"
                data-campo="valor"
                data-index="${index}"
              >
            </div>

            <div class="total-item" data-total-item="${index}">
              Total: ${formatarMoeda(totalItem)}
            </div>
          </div>
        `;

        lista.appendChild(linha);
      });

      atualizarTotalGeral();
      configurarEventos();
    }

    function atualizarLinha(index) {
      const item = itens[index];
      const total = Number(item.quantidade || 0) * Number(item.valor || 0);
      const totalElemento = document.querySelector(`[data-total-item="${index}"]`);
      const itemContainer = document.querySelector(`.swipe-item[data-index="${index}"]`);
      const status = itemContainer?.querySelector(".status-item");

      if (totalElemento) {
        totalElemento.textContent = "Total: " + formatarMoeda(total);
      }

      if (status) {
        const preenchido = Number(item.quantidade) > 0 && Number(item.valor) > 0;
        status.textContent = preenchido ? "✓ Preenchido" : "Pendente";
        status.classList.toggle("preenchido", preenchido);
      }

      atualizarTotalGeral();
    }

    function configurarEventos() {
      document.querySelectorAll("[data-excluir]").forEach(botao => {
        botao.addEventListener("click", () => {
          const index = Number(botao.dataset.excluir);
          itens.splice(index, 1);
          salvar();
          renderizar();
        });
      });

      document.querySelectorAll("input[data-campo]").forEach(campo => {
        const salvarCampo = () => {
          const index = Number(campo.dataset.index);
          const tipo = campo.dataset.campo;

          itens[index][tipo] = converterNumero(campo.value);
          salvar();
          atualizarLinha(index);
        };

        campo.addEventListener("input", salvarCampo);
        campo.addEventListener("change", salvarCampo);
        campo.addEventListener("blur", salvarCampo);

        campo.addEventListener("focus", () => {
          fecharOutrosItens();
        });
      });

      document.querySelectorAll(".swipe-item").forEach(itemElemento => {
        const conteudo = itemElemento.querySelector(".conteudo-item");
        let inicioX = 0;
        let inicioY = 0;
        let arrastando = false;
        let movimentoHorizontal = false;

        itemElemento.addEventListener("touchstart", evento => {
          if (evento.target.closest("input, button")) return;

          const toque = evento.touches[0];
          inicioX = toque.clientX;
          inicioY = toque.clientY;
          arrastando = true;
          movimentoHorizontal = false;
        }, { passive: true });

        itemElemento.addEventListener("touchmove", evento => {
          if (!arrastando) return;

          const toque = evento.touches[0];
          const deltaX = toque.clientX - inicioX;
          const deltaY = toque.clientY - inicioY;

          if (!movimentoHorizontal && Math.abs(deltaY) > Math.abs(deltaX)) {
            arrastando = false;
            return;
          }

          if (Math.abs(deltaX) > 10) {
            movimentoHorizontal = true;
          }

          if (!movimentoHorizontal) return;

          if (deltaX < 0) {
            conteudo.style.transition = "none";
            conteudo.style.transform = `translateX(${Math.max(deltaX, -LIMITE_SWIPE)}px)`;
          }

          if (deltaX > 0 && conteudo.classList.contains("aberto")) {
            conteudo.style.transition = "none";
            conteudo.style.transform = `translateX(${Math.min(-LIMITE_SWIPE + deltaX, 0)}px)`;
          }
        }, { passive: true });

        itemElemento.addEventListener("touchend", evento => {
          if (!arrastando && !movimentoHorizontal) return;

          const toque = evento.changedTouches[0];
          const deltaX = toque.clientX - inicioX;

          conteudo.style.transition = "";
          conteudo.style.transform = "";

          if (deltaX < -45) {
            fecharOutrosItens(conteudo);
            conteudo.classList.add("aberto");
          } else if (deltaX > 25) {
            conteudo.classList.remove("aberto");
          } else if (!conteudo.classList.contains("aberto")) {
            fecharOutrosItens();
          }

          arrastando = false;
          movimentoHorizontal = false;
        }, { passive: true });
      });
    }

    form.addEventListener("submit", evento => {
      evento.preventDefault();

      const nome = novoItemInput.value.trim();

      if (!nome) {
        novoItemInput.focus();
        return;
      }

      itens.push({
        item: nome,
        quantidade: 0,
        valor: 0
      });

      novoItemInput.value = "";
      salvar();
      renderizar();
      novoItemInput.focus();
    });

    document.addEventListener("click", evento => {
      if (!evento.target.closest(".swipe-item")) {
        fecharOutrosItens();
      }
    });

    renderizar();
  </script>
</body>
</html>
